<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');

        h1 {
            font: bold 2em 'Work Sans', times, serif;
        }

        p {
            font: light 3em Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad minus dignissimos quidem blanditiis distinctio vero, repellat maxime ab nesciunt cum asperiores a animi. Corporis aliquid ad, eum animi perferendis repellendus?</p>
</body>
</html>
