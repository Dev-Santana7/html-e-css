<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love Larry' ;
            src: url('love larry ttf.ttf'); format(truetype)~
            font-weight: normal;
            font-style: normal;

            /* Tipos de Format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced typography)
            - svg
             */
        }

        h1 {
            font-family: 'Love Larry', times, serif;
            font-weight: normal;
            font-style: italic;

        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias ducimus ea nesciunt eos, accusantium sunt molestias vitae sint culpa reiciendis laudantium minus veniam, consequuntur id facere cupiditate, possimus asperiores rerum!</p>
</body>
</html>
