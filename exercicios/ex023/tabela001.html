<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif ;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        tr{
            background-color: lightgray;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            /* Nova Propriedade de CSS com ótimo funcionamento com Celulas de tabelas: vertical-align: ;*/
            vertical-align: top;
        }
    </style>    
</head>         
<body>

    <!-- O W3C que é o instituto que mantem atualizaçõpes de HTML e o CSS diz que, para as tags <tr> e <td> não necessitam mais de tags de fechamento (</>).
        
     OBS: Seja extremamente organizado com os dados da tabela porque elas são extremamente organizacionais!   
    -->


    <h1>Minha primeira Tabela</h1>
    <!-- HIERARQUIA DE TABELAS (simples)
     TABLE = tabela
        TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela
    --> 
    <table>
        <tr> <!-- Primeira linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>

</body>
</html>
