<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhando Verticalmente</title>
    <style>

        /*Para centralizar uma 'div' verticalmente, a div que contem o conteúdo tenha um 'position: relative';.
        E a própria 'div' do conteúdo ter um 'position: absolute;' para que então, a gente possar centralizar usando o 'transform: translate();' usando valores negativos '-'.
        
        OBS: Não vai funcionar se não tiver o 'left' e o 'top' de 505
        */
        #container{
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: relative;
            background-color: purple;
            padding: 10px;
            height: 500px;
        }

        #conteudo{
            position: absolute;
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            background-color: yellow;
            height: 200px;
            width: 400px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">
        </article>
    </section>
</body>
</html>
