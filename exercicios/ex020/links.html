<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: crimson;
            text-decoration: none;
        }

        a:visited {
             color: rgb(47, 0, 255);
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        /* Para chamar uma pseudo-classe se usa ":", já para chamar um pseudo-elemento se usa "::" */

        a::after {
            content: ' (Link)';
            text-decoration: none;
            color: blue;
        } 
    </style>
</head>
<body>  
    <h1> Personalizando Links</h1>
    <ul>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank">Repositorio do GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo/">Canal do YouTube</a></li>
        <li><a href="https://youtube.com/cursoemvideo/">Site do Curso em Vídeo</a></li>
    </ul>
</body>
</html>
