<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style> 
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            font-weight: 600;
        }

        div:hover {
            color: chartreuse;
        }

        /* Para chamar um elemento semantico dentro de uma "div", usa-se o sinal de maior quê ">". */

        div > p {
            display: none;
        }

        div:hover > p{
            display: block;
            color: white;
            background-color: rgb(4, 0, 255);
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobre o texto abaixo e veja o que acontece</p>
    <div>Passe o mouse aqui!!!
        <p>TEXTO ESCONDIDO KKKK</p>
    </div>
    <p>FIM DO TEXTO</p>
</body>
</html>
