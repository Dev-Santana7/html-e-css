<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Gradiente</title>
    <style>
        * { /* configuração global */
            height: 100%;
        }

        body{
            background-image: linear-gradient(to bottom, #0043BF, #204180,
            #6A5423, #BF8300);
            background-attachment: fixed;
        }

        h1{
            color: rgb(255, 255, 255);
            
        }
    </style>
</head>
<body>
    <H1>Testando Degradê de Cores com CSS</H1>
    
</body>
</html>
